# Local (dev-only) media stack for /filming. Mirrors the Hetzner setup: Postgres for
# metadata, MinIO (S3 API) for files. Ports avoid clashing with other projects.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: javidan
      POSTGRES_PASSWORD: javidan
      POSTGRES_DB: javidan
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javidan -d javidan"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: javidan
      MINIO_ROOT_PASSWORD: javidan-dev-secret
    ports:
      - "9006:9000"
      - "9007:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
